<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #fafafa;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 20px;
        }

        header {
            margin-bottom: 80px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.02em;
        }

        .subtitle {
            font-size: 1.1rem;
            color: #666;
            font-weight: 400;
        }

        .projects {
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .project {
            background: white;
            padding: 32px;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
            transition: all 0.2s ease;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .project:hover {
            border-color: #1a1a1a;
            transform: translateY(-2px);
        }

        .project-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .project h2 {
            font-size: 1.3rem;
            font-weight: 500;
        }

        .arrow {
            color: #999;
            font-size: 1.2rem;
            transition: transform 0.2s ease;
        }

        .project:hover .arrow {
            transform: translateX(4px);
            color: #1a1a1a;
        }

        .project p {
            color: #666;
            font-size: 0.95rem;
            line-height: 1.6;
        }

        footer {
            margin-top: 100px;
            padding-top: 40px;
            border-top: 1px solid #e5e5e5;
            text-align: center;
            color: #999;
            font-size: 0.9rem;
        }

        footer a {
            color: #666;
            text-decoration: none;
            border-bottom: 1px solid #e5e5e5;
            transition: border-color 0.2s ease;
        }

        footer a:hover {
            border-bottom-color: #1a1a1a;
        }

        @media (max-width: 600px) {
            .container {
                padding: 60px 20px;
            }

            h1 {
                font-size: 2rem;
            }

            .project {
                padding: 24px;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>Projects</h1>
        <p class="subtitle">A collection of things I've built</p>
    </header>

    <div class="projects">
        <a href="./password_generator/" class="project">
            <div class="project-header">
                <h2>Password Generator</h2>
                <span class="arrow">→</span>
            </div>
            <p>A secure random password generator with customizable length and character types. Features one-click copy to clipboard.</p>
        </a>

        <a href="#" class="project" style="opacity: 0.5; pointer-events: none;">
            <div class="project-header">
                <h2>Coming Soon</h2>
                <span class="arrow">→</span>
            </div>
            <p>More projects in development.</p>
        </a>
    </div>

    <footer>
        <p>Built by <a href="https://github.com/Praveen-Anirudhan">Praveen Anirudh with 💖</a></p>
    </footer>
</div>
</body>
</html>
