<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Random Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Generate a <br><span>Random Password</span></h1>
    <div class="display">
        <input type="text" placeholder="Password" id="password">
        <img src="images/copy.png" alt="copy-image" id="copy-btn">
    </div>
    <button id="generate-button"><img src="images/generate.png" alt="generate-password">Generate Password</button>
</div>
<div id="toast">
    <span class="toast-icon">✓</span>
    <span class="toast-text">Password copied to clipboard!</span>
</div>
<script src="script.js"></script>
</body>
</html>
